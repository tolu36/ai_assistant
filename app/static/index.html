<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b87">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI Assistant">
  <title>Personal AI Assistant</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <h1>Personal AI Assistant</h1>
      <button id="refresh-brief" type="button">Refresh Brief</button>
    </header>

    <section class="panel brief-panel">
      <div class="toolbar">
        <h2>Morning Brief</h2>
      </div>
      <div class="read-aloud" aria-label="Read aloud controls">
        <div class="button-row read-buttons">
          <button id="read-play" type="button">Play</button>
          <button id="read-pause" type="button">Pause</button>
          <button id="read-stop" type="button">Stop</button>
        </div>
        <label class="compact-control">
          Section
          <select id="read-section">
            <option value="all">All</option>
            <option value="daily_quote">Daily Note</option>
            <option value="news">News</option>
            <option value="sports">Sports</option>
            <option value="finance">Finance</option>
          </select>
        </label>
        <label class="compact-control rate-control">
          Speed
          <input id="read-rate" type="range" min="0.75" max="1.5" step="0.05" value="1">
          <span id="read-rate-value">1.00x</span>
        </label>
        <div id="read-status" class="read-status" aria-live="polite"></div>
      </div>
      <div id="brief" class="brief"></div>
    </section>

    <details class="panel history-panel">
      <summary>Brief History</summary>
      <div class="history-content">
        <div class="toolbar">
          <h2>Saved Briefs</h2>
          <button id="load-history" type="button">Load History</button>
        </div>
        <div id="brief-history" class="history-list"></div>
      </div>
    </details>

    <section class="panel">
      <div class="grid">
        <form id="preferences-form" class="card">
          <h2>Preferences</h2>
          <label>
            Sports
            <input id="sports-interests" placeholder="NBA, Tennis, NHL">
          </label>
          <label>
            Teams or Athletes
            <input id="sports-teams" placeholder="Toronto Raptors, Serena Williams">
          </label>
          <label>
            Finance Topics
            <input id="finance-topics" placeholder="Interest rates, Bank of Canada, inflation, housing">
          </label>
          <label>
            Companies, Stocks, ETFs
            <input id="finance-watchlist" placeholder="XEQT.TO, VEQT.TO, VFV.TO, XIC.TO, ZAG.TO, CASH.TO">
          </label>
          <button type="submit">Save Preferences</button>
        </form>

        <form id="schedule-form" class="card">
          <h2>Schedule Task</h2>
          <label>
            Task
            <input id="task" placeholder="Study for 2 hours tonight">
          </label>
          <div class="button-row">
            <button id="propose-task" type="button">Propose Times</button>
            <button type="submit">Schedule</button>
          </div>
          <div id="proposal-actions" class="proposal-actions hidden">
            <label>
              Feedback
              <input id="proposal-feedback" placeholder="Too late, I am sleeping then">
            </label>
            <div class="button-row">
              <button id="revise-proposal" type="button">Revise Proposal</button>
              <button id="confirm-proposal" type="button">Confirm All Times</button>
            </div>
          </div>
          <div id="schedule-output" class="schedule-output"></div>
        </form>
      </div>
    </section>

    <details class="panel status-panel">
      <summary>System Status</summary>
      <div class="status-content">
        <div class="toolbar">
          <h2>Status</h2>
          <button id="refresh-status" type="button">Refresh Status</button>
        </div>
        <div id="system-status" class="status-grid"></div>
      </div>
    </details>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
