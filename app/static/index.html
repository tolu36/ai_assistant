<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal AI Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <h1>Personal AI Assistant</h1>
      <div id="llm-status" class="status-bar">Checking LLM status...</div>
      <div class="grid">
        <form id="preferences-form" class="card">
          <h2>Preferences</h2>
          <label>
            Sports
            <input id="sports-interests" placeholder="NBA, Tennis, NHL">
          </label>
          <label>
            Teams or Athletes
            <input id="sports-teams" placeholder="Toronto Raptors, Serena Williams">
          </label>
          <label>
            Finance Watchlist
            <input id="finance-watchlist" placeholder="AAPL, NVDA, SPY">
          </label>
          <button type="submit">Save Preferences</button>
        </form>

        <form id="schedule-form" class="card">
          <h2>Schedule Task</h2>
          <label>
            Task
            <input id="task" placeholder="Study for 2 hours tonight">
          </label>
          <div class="button-row">
            <button id="propose-task" type="button">Propose Times</button>
            <button type="submit">Schedule</button>
          </div>
          <div id="proposal-actions" class="proposal-actions hidden">
            <label>
              Feedback
              <input id="proposal-feedback" placeholder="Too late, I am sleeping then">
            </label>
            <div class="button-row">
              <button id="revise-proposal" type="button">Revise Proposal</button>
              <button id="confirm-proposal" type="button">Confirm Proposal</button>
            </div>
          </div>
          <pre id="schedule-output"></pre>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Morning Brief</h2>
        <button id="refresh-brief" type="button">Refresh</button>
      </div>
      <div id="brief" class="brief"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
